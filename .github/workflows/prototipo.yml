# Fluxo do protótipo — três branches, um único link publicado.
#
#   push em Leonardo/Ronaldo/Thiago
#     -> verificar   exige entrada nova em historico/
#     -> integrar    traz a main para a branch e leva a branch para a main
#     -> publicar    injeta o histórico e publica no GitHub Pages
#     -> sincronizar devolve a main para as outras branches
#
#   push na main        -> publicar -> sincronizar
#   Run workflow (SHA)  -> publicar apenas (rollback, não altera a main)
#
# Configuração necessária, uma vez:
#   Settings > Pages > Source: GitHub Actions
#   Settings > Environments > github-pages > Deployment branches: All branches
#   Settings > Actions > General > Workflow permissions: Read and write

name: Publicar prototipo

on:
  push:
    branches: [main, Leonardo, Ronaldo, Thiago]
  workflow_dispatch:
    inputs:
      ref:
        description: "Rollback: código do commit a republicar. Vazio = main."
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: prototipo
  cancel-in-progress: false

env:
  BRANCHES: Leonardo Ronaldo Thiago
  # Pasta que contém o protótipo vivo. O index.html dela é copiado para a raiz
  # do site publicado, então a URL principal serve esta versão. As pastas
  # antigas (v4..v7) continuam no ar em /v4/, /v5/ etc.
  # Renomeou a pasta? Troque só esta linha.
  PASTA: v8

jobs:
  # ---------------------------------------------------------------- verificar
  verificar:
    name: Histórico obrigatório
    if: github.event_name == 'push' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conferir entrada em historico/
        run: |
          git fetch origin main
          MUDOU=$(git diff --name-only origin/main...HEAD)
          echo "Arquivos alterados:"; echo "$MUDOU" | sed 's/^/  /'

          if ! echo "$MUDOU" | grep -qx "$PASTA/index.html"; then
            echo "$PASTA/index.html não mudou — entrada de histórico não é exigida."
            exit 0
          fi

          if echo "$MUDOU" | grep -q '^historico/'; then
            echo "Entrada de histórico encontrada."
            exit 0
          fi

          echo "::error::O $PASTA/index.html foi alterado sem entrada nova em historico/."
          echo "## Faltou o registro da alteração" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "O \`$PASTA/index.html\` mudou, mas nenhum arquivo novo foi criado" \
               "em \`historico/\`." >> $GITHUB_STEP_SUMMARY
          # Heredoc com 'FIM' entre quotes: nada de expansão, os backticks do
          # bloco markdown abaixo ficam literais.
          cat >> $GITHUB_STEP_SUMMARY <<'FIM'

          Crie `historico/AAAA-MM-DD-descricao-curta.md` com 1 a 3 bullets
          dizendo o que mudou para quem usa o protótipo. Exemplo:

          ```markdown
          - Margem estimada agora fica fixa no topo ao rolar
          - Notional saiu do cabeçalho
          ```

          Não escreva nome, data nem número de versão — isso é automático.
          FIM
          exit 1

  # ----------------------------------------------------------------- integrar
  integrar:
    name: Levar para a main
    needs: verificar
    if: github.event_name == 'push' && github.ref_name != 'main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          # 1. Trazer a main para dentro da branch (evita divergência).
          if ! git merge --no-edit origin/main -m "Sincroniza main em $BRANCH"; then
            git merge --abort || true
            echo "::error::Conflito entre $BRANCH e a main. Abrindo PR."
            gh pr create --base main --head "$BRANCH" \
              --title "Conflito: $BRANCH x main" \
              --body "O merge automático parou por conflito. Resolva por aqui — o \
          arquivo é único e o merge precisa de olho humano." 2>/dev/null \
              || echo "PR já existe."
            cat >> $GITHUB_STEP_SUMMARY <<'FIM'
          ## Conflito com a main

          A branch e a main mexeram no mesmo trecho do `index.html`. Um Pull
          Request foi aberto — resolva por lá. Nada foi publicado.
          FIM
            exit 1
          fi

          # 2. Devolver a branch já atualizada.
          git push origin "HEAD:$BRANCH"

          # 3. Levar para a main (fast-forward, já contém a main).
          git push origin "HEAD:main"

          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "Integrado: $(git rev-parse --short HEAD) -> main"

  # ----------------------------------------------------------------- publicar
  publicar:
    name: Publicar
    needs: integrar
    if: |
      always() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       github.ref_name == 'main' ||
       needs.integrar.result == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || needs.integrar.outputs.sha || github.sha }}
          fetch-depth: 0

      - name: Servir a pasta atual na raiz
        run: |
          if [ ! -f "$PASTA/index.html" ]; then
            echo "::error::$PASTA/index.html não existe. Ajuste a variável PASTA no topo deste workflow."
            exit 1
          fi
          # Cópia, não movimentação: /v8/ e as pastas antigas continuam no ar.
          cp "$PASTA/index.html" index.html
          echo "Raiz do site servindo $PASTA/index.html"

      - name: Injetar histórico
        id: hist
        env:
          ALVO_HTML: index.html
        run: python3 .github/scripts/injetar_historico.py

      - name: Desativar Jekyll
        run: touch .nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Resumo
        run: |
          {
            echo "## Publicado — v${{ steps.hist.outputs.versao }}"
            echo ""
            echo "- Site: ${{ steps.deploy.outputs.page_url }}"
            echo "- Commit: \`$(git rev-parse --short HEAD)\`"
            echo "- Origem: \`${{ inputs.ref || github.ref_name }}\`"
          } >> $GITHUB_STEP_SUMMARY

  # -------------------------------------------------------------- sincronizar
  sincronizar:
    name: Devolver main para as branches
    needs: publicar
    if: needs.publicar.result == 'success' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge da main em cada branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin

          for B in $BRANCHES; do
            if ! git show-ref --verify --quiet "refs/remotes/origin/$B"; then
              echo "- $B não existe, pulando"; continue
            fi

            git checkout -B "sync-$B" "origin/$B" --quiet

            if git merge --no-edit main -m "Sincroniza main em $B"; then
              if git push origin "HEAD:$B"; then
                echo "- $B atualizada"
              else
                echo "- $B: push recusado (alguém subiu algo agora), pulando"
              fi
            else
              git merge --abort || true
              echo "::warning::$B tem conflito com a main e não foi sincronizada."
              echo "- $B: CONFLITO, precisa resolver na mão"
            fi
          done >> $GITHUB_STEP_SUMMARY
